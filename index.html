<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TorresPropertyServices</title>
    <meta name="description" content="Torres Property Services offers comprehensive home maintenance solutions including gutter cleaning, roof repairs, junk removal, and HVAC installations to enhance property care." />
    <meta name="robots" content="noindex, nofollow" />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Netlify Forms detection -->
    <form name="contact" netlify netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="service"></select>
      <textarea name="message"></textarea>
      <input type="file" name="photos" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
